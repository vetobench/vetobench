name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      # TODO before launch: pin both actions to full commit SHAs (Scorecard "Pinned-Dependencies").
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests (includes the static no-network check)
        run: node --test
      - name: Run the CLI with networking switched off
        run: unshare --user --net node bin/vetobench.js test/fixtures/projects
