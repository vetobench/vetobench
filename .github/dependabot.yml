version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait until a release is 14 days old before proposing it, so a compromised
    # release has time to be caught. Security updates are not delayed.
    cooldown:
      default-days: 14
    # One pull request for all action updates.
    groups:
      github-actions:
        patterns:
          - '*'
