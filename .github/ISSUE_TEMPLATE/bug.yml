name: Bug report
description: vetobench crashed, printed something wrong, or behaved unexpectedly.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Paste **only counts**, versions and error messages, with any folder or file path replaced by `<dir>` or `<file>`.
        Never paste transcripts, commands, prompts, file paths, rule bodies or secrets. If you need to show an input, write a small synthetic one.
        Network activity by vetobench, or output that reveals commands, paths, prompts, rule bodies or secrets, is a vulnerability: [report it privately](https://github.com/vetobench/vetobench/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: vetobench version
      description: The output of `npx vetobench --version`.
      placeholder: 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Windows (WSL)
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: The output of `node --version`.
      placeholder: v22.11.0
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: The vetobench command and its options, with paths replaced by `<dir>` or `<file>`.
      placeholder: npx vetobench fix <dir> --json
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The error message or the counts that look wrong. Counts and messages only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: aggregates
    attributes:
      label: Only counts
      options:
        - label: I pasted only counts, versions and error messages, with paths replaced. No transcripts, commands, prompts, rule bodies or secrets.
          required: true
