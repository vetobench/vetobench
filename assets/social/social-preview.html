<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>vetobench social preview (1280x640)</title>
<!--
  GitHub social preview for github.com/vetobench/vetobench (Settings > General > Social preview).
  Render: "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu
    --hide-scrollbars --force-device-scale-factor=1 --window-size=1280,640
    --screenshot=social-preview.png file://$PWD/social-preview.html
  Safe area: 88 px left/right, 64 px top/bottom (LinkedIn crops to ~1.91:1; some clients round corners).
  Numbers: 12 and 236,734 only (CLAIMS.md rows #3 and #1).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #141416; color: #F2F2F0;
    font-family: system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .frame { width: 1280px; height: 640px; padding: 64px 88px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; }
  .lockup { display: block; height: 88px; width: auto; }
  .url { margin-left: auto; color: #8E8E94; font-size: 24px; }
  h1 { margin: auto 0 0; font-size: 100px; line-height: 1.04; letter-spacing: -0.025em; font-weight: 700; }
  .sub { margin: 30px 0 0; color: #8E8E94; font-size: 38px; line-height: 1.3; }
  .sub b { color: #FF5A1F; font-weight: 700; }
</style>
</head>
<body>
<div class="frame" role="img" aria-label="vetobench: who approved your coding agent's actions?">
  <div class="top">
    <img class="lockup" src="../logo/lockup-dark.svg" alt="[y/N] vetobench">
    <span class="url mono">github.com/vetobench/vetobench</span>
  </div>
  <h1>Who approved your<br>coding agent's actions?</h1>
  <p class="sub">In 30 days I approved <b>12</b> of my coding agent's<br>236,734 actions myself.</p>
</div>
</body>
</html>
