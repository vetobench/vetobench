<svg xmlns="http://www.w3.org/2000/svg" width="901" height="577" viewBox="0 0 901 577" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="14" fill="#F2F2F0" role="img" aria-labelledby="title desc">
<title id="title">vetobench demo (example data)</title>
<desc id="desc">A terminal types npx vetobench and prints a card of who approved a coding agent's actions, then types npx vetobench fix and prints a dry run of the allow-rules it would remove. Example data from synthetic transcripts.</desc>
<style>text{white-space:pre}</style>
<rect width="901" height="577" rx="12" fill="#0C0C0E"/>
<rect x="1" y="1" width="899" height="575" rx="11" fill="none" stroke="#2C2C33" stroke-width="2"/>
<path d="M1 38H900" stroke="#2C2C33" stroke-width="2"/>
<circle cx="28" cy="19.5" r="6" fill="#2C2C33"/>
<circle cx="48" cy="19.5" r="6" fill="#2C2C33"/>
<circle cx="68" cy="19.5" r="6" fill="#2C2C33"/>
<rect x="767" y="7.5" width="112" height="23" rx="11.5" fill="none" stroke="#FF5A1F" stroke-width="1.5"/>
<text x="823" y="24" text-anchor="middle" font-size="13" fill="#FF5A1F">example data</text>
