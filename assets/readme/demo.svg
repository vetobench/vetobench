<g clip-path="url(#screen)"><g><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.9583;0.9965;1" dur="14.3825s" repeatCount="indefinite" calcMode="linear"/>
<g transform="translate(0 50)">
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -19;0 -38;0 -57;0 -76;0 -95;0 -114;0 -133;0 -152;0 -171;0 -190;0 -209;0 -228;0 -247" keyTimes="0;0.6162;0.6204;0.6245;0.6287;0.6329;0.6371;0.6412;0.6454;0.6496;0.6537;0.6579;0.6621;0.6663" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2715;0.2889;0.4731;0.4905;1" dur="14.3825s" repeatCount="indefinite" calcMode="linear"/><rect x="14" y="209" width="602" height="19" rx="3" fill="#FF5A1F" fill-opacity="0.16"/><rect x="14" y="209" width="3" height="19" fill="#FF5A1F"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6871;0.7045;0.9583;0.9757;1" dur="14.3825s" repeatCount="indefinite" calcMode="linear"/><rect x="14" y="665" width="425.6" height="19" rx="3" fill="#FF5A1F" fill-opacity="0.16"/><rect x="14" y="665" width="3" height="19" fill="#FF5A1F"/></g>
<text x="22" y="13.87" textLength="126" lengthAdjust="spacing" clip-path="url(#k0)"><tspan fill="#FF5A1F">$</tspan> npx vetobench</text>
<text x="22" y="32.87" textLength="420" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1464" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>vetobench 0.2.0: who approved your agent's actions</text>
<text x="22" y="51.87" textLength="756" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1505" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>7 transcripts · 2026-11-03 to 2026-11-17 · 186 of 190 tool calls carry a recorded decision</text>
<text x="22" y="89.87" textLength="604.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1589" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Static allow-rule (single command)                        107    57.5%</text>
<text x="22" y="108.87" textLength="604.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.163" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Static allow-rules (compound command)                      11     5.9%</text>
<text x="22" y="127.87" textLength="604.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1672" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  AI classifier                                              60    32.3%</text>
<text x="22" y="146.87" textLength="604.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1714" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  You, through a permission prompt                            3     1.6%</text>
<text x="22" y="165.87" textLength="604.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1756" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Blocked by the AI classifier                                4     2.2%</text>
<text x="22" y="184.87" textLength="604.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1797" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Rejected or cancelled by you                                1     0.5%</text>
<text x="22" y="222.87" textLength="588" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1881" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Static rules approved 63.4%, the AI classifier 32.3%, you 3 action(s).</text>
<text x="22" y="241.87" textLength="831.6" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.1923" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>At least 15 static-approved shell actions relied on a wildcard interpreter or remote rule (git 15).</text>
<text x="22" y="279.87" textLength="235.2" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2006" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Where the agent was running:</text>
<text x="22" y="298.87" textLength="756" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2048" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Main sessions (interactive)         76    40.9%   rules 64.5% · classifier 30.3% · you 3</text>
<text x="22" y="317.87" textLength="756" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2089" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Loops (/loop, /goal)                25    13.4%   rules 52.0% · classifier 44.0% · you 0</text>
<text x="22" y="336.87" textLength="756" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2131" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Inside subagents                    85    45.7%   rules 65.9% · classifier 30.6% · you 0</text>
<text x="22" y="374.87" textLength="856.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2215" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Your allow-rules now: 20 allow in 1 settings file(s) · 2 deny · 3 ask · 2 wildcard interpreter/remote </text>
<text x="22" y="393.87" textLength="268.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2256" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>rule(s) · 1 with a secret inline</text>
<text x="22" y="412.87" textLength="554.4" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2298" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>5 of 17 shell allow-rules never approved a command in this window.</text>
<text x="22" y="450.87" textLength="714" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2381" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Run with --secrets to also count passwords, keys and tokens left in your transcripts.</text>
<text x="22" y="488.87" textLength="562.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2465" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Not counted: approvals you give in chat. Nothing left this machine.</text>
<text x="22" y="507.87" textLength="159.6" lengthAdjust="spacing" clip-path="url(#k26)"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.2507" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/><tspan fill="#FF5A1F">$</tspan> npx vetobench fix</text>
<text x="22" y="526.87" textLength="571.2" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6162" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>vetobench 0.2.0 fix: what --write would remove from your allow-rules</text>
<text x="22" y="545.87" textLength="512.4" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6204" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>History: 7 transcripts · 2026-11-03 to 2026-11-17 (15 day(s))</text>
<text x="22" y="564.87" textLength="218.4" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6245" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Settings files: 1 checked.</text>
<text x="22" y="602.87" textLength="470.4" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6329" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Rules with a secret inside                           1</text>
<text x="22" y="621.87" textLength="470.4" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6371" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Broad wildcards (python3:*, ssh:*, git:* ...)        2</text>
<text x="22" y="640.87" textLength="470.4" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6412" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>  Shell rules that never approved a command            4</text>
<text x="22" y="678.87" textLength="411.6" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6496" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Would remove 7 of 20 allow-rules, from 1 file(s).</text>
<text x="22" y="697.87" textLength="722.4" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6537" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Dry run: nothing was changed. Run with --write to apply; each file is backed up first.</text>
<text x="22" y="735.87" textLength="630" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6621" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/>Counts only: no rule, path or secret is printed. Nothing left this machine.</text>
<text x="22" y="754.87" textLength="16.8" lengthAdjust="spacing"><animate attributeName="visibility" values="hidden;visible" keyTimes="0;0.6663" dur="14.3825s" repeatCount="indefinite" calcMode="discrete"/><tspan fill="#FF5A1F">$</tspan> </text>
